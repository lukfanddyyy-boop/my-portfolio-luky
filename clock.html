<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="css/clock.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container navbar-container">
            <div class="logo">Luky.</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="clock.html" class="active-link">Clock</a></li>
            </ul>
            <div class="social-icons">
                <a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://linkedin.com" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://twitter.com" target="_blank" title="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <section class="clock-container">
        <div class="container">
            <div class="clock-header">
                <h1>Digital Clock</h1>
                <p>Current time in different time zones</p>
            </div>

            <!-- CONTROLS -->
            <div class="controls">
                <button class="btn-control" id="add-timezone-btn">
                    <i class="fas fa-plus"></i> Add Time Zone
                </button>
                <button class="btn-control" id="toggle-format-btn">
                    <i class="fas fa-clock"></i> 12H / 24H
                </button>
            </div>

            <!-- CLOCKS GRID -->
            <div class="clocks-grid" id="clocks-grid">
                <!-- Clock cards will be generated by JavaScript -->
            </div>

            <!-- TIMEZONE SELECTOR MODAL -->
            <div class="modal" id="timezone-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Select Time Zone</h2>
                        <button class="modal-close" id="modal-close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <input type="text" class="timezone-search" id="timezone-search" placeholder="Search timezone...">
                        <div class="timezone-list" id="timezone-list">
                            <!-- Timezones will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Luky Irfandi. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/clock.js"></script>
</body>
</html>
